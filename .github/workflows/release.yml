name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require tag to match project version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Install build dependencies
        run: python -m pip install -e . build
      - name: Validate and test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: |
          python scripts/validate_project_skills.py
          python -m unittest discover -s tests -v
      - name: Build release artifacts
        run: |
          python -m build
          python scripts/package_v3_portable.py
          cd dist
          sha256sum *.whl *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS --generate-notes
